<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - CBT</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <div class="logo">
                    <span>✦</span>
                    <strong>CBT</strong>
                </div>

                <h1>
                    Welcome back
                </h1>

                <p>
                    Log in to continue your practice.
                </p>

            </div>


            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <p
                    id="login-error"
                    class="auth-error"
                ></p>


                <button
                    type="submit"
                    class="start-button auth-button"
                >
                    Log In
                    <span>→</span>
                </button>

            </form>


            <div class="auth-footer">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create one
                </a>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
