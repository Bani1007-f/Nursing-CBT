<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | NURSING 4D PREP</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <a href="/" class="logo">
    <img
        src="images/nursing-4d-prep.svg"
        alt="Nursing 4D Prep - Learn. Practise. Prepare."
    >
</a>

                <h1>
                    Welcome back
                </h1>

                <p>
                    Log in to continue your practice.
                </p>

            </div>


            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <p class="auth-footer">
    <a href="forgot-password.html">Forgot password?</a>
</p>


                <p
                    id="login-error"
                    class="auth-error"
                ></p>


                <button
                    type="submit"
                    class="start-button auth-button"
                >
                    Log In
                    <span>→</span>
                </button>

            </form>


            <div class="auth-footer">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create one
                </a>

            </div>

        </section>

    </main>


    <script src="js/navigation.js"></script>
    <script src="js/password-toggle.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
