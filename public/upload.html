<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Questions</title>

</head>


<body>
    <header class="topbar">

    <a href="/" class="logo">
    <img
        src="images/nursing-4d-prep.svg"
        alt="Nursing 4D Prep - Learn. Practise. Prepare."
    >
</a>

    <nav
        id="main-nav"
    >
    </nav>

</header>

    <h1>Upload Questions</h1>


    <form id="upload-form">


        <!-- COURSE -->

        <label for="course">
            Course
        </label>

        <select
            id="course"
            name="course"
            required
        >

            <option value="">
                Select Course
            </option>

        </select>


        <br><br>


       <!-- Category-->
        <div id="category-container" style="display: none;">

    <label for="category">
        System / Category
    </label>

    <select
        id="category"
        name="category"
        disabled
    >

        <option value="">
            Select System / Category
        </option>

    </select>

    <br><br>

</div>

        <!-- TOPIC -->

        <label for="topic">
            Topic
        </label>

        <select
            id="topic"
            name="topic"
            required
            disabled
        >

            <option value="">
                Select Topic
            </option>

        </select>

<button
    type="button"
    id="create-topic-button"
>
    + Create New Topic
</button>

        <br><br>
<div id="new-topic-section" style="display: none;">

    <label for="new-topic-name">
        New Topic Name
    </label>

    <input
        type="text"
        id="new-topic-name"
        name="newTopicName"
        placeholder="e.g. Cardiovascular"
    >


    <label for="new-topic-question-count">
        Test Length
    </label>

    <select
        id="new-topic-question-count"
        name="newTopicQuestionCount"
    >

        <option value="20">
            20 Questions
        </option>

        <option value="30">
            30 Questions
        </option>
        <option value="60">60 Questions</option>

    </select>

</div>

        <!-- JSON FILE -->

        <label for="questionFile">
            Question JSON File
        </label>

        <input
            type="file"
            id="questionFile"
            name="questionFile"
            accept=".json,application/json"
            required
        >


        <br><br>


        <button
            type="submit"
            id="upload-button"
        >
            Upload Questions
        </button>


    </form>


    <br>


    <div id="message"></div>

<script src="js/navigation.js"></script>
    <script src="js/upload.js"></script>

</body>

</html>
