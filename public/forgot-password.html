<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Nursing CBT</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <h1>Forgot Password?</h1>
            <p>Enter the email address linked to your account. If an account exists, we'll send you a reset link.</p>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <p id="message" role="status" aria-live="polite"></p>

                <button type="submit" class="auth-button" id="submit-button">
                    Send Reset Link
                </button>
            </form>

            <p class="auth-footer">
                <a href="login.html">Back to Login</a>
            </p>
        </section>
    </main>

    <script src="js/forgot-password.js"></script>
</body>
</html>
