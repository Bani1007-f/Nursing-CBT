<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Test Review</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div class="logo">

            <span>✦</span>

            <strong>CBT</strong>

        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="history.html">
                History
            </a>

        </nav>

    </header>


    <!-- =========================
         REVIEW PAGE
    ========================== -->

    <main class="attempt-page">

        <section class="attempt-header">

            <a href="history.html">
                ← Back to History
            </a>


            <p
                id="attempt-course"
                class="eyebrow"
            >
                Loading...
            </p>


            <h1 id="attempt-topic">
                Loading result...
            </h1>


            <div
                id="attempt-summary"
                class="attempt-summary"
            >
            </div>

        </section>


        <!-- =========================
             QUESTIONS
        ========================== -->

        <section
            id="attempt-questions"
            class="attempt-questions"
        >

            <p>
                Loading questions...
            </p>

        </section>

    </main>


    <script src="js/attempt.js"></script>

</body>

</html>
