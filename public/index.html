<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CBT</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topbar">

        <div class="logo">
            <span>✦</span>
            <strong>CBT</strong>
        </div>

        <nav>

    <a href="index.html">
        Home
    </a>

    <a href="history.html">
        History
    </a>

    <a href="settings.html">
        Settings
    </a>

</nav>

    </header>


    <main class="home">

        <section class="hero">

            <p class="eyebrow">COMPUTER-BASED TEST</p>

            <h1>
                Test your knowledge.<br>
                Know your level.
            </h1>

            <p class="hero-text">
                Select a course and topic to begin your practice test.
            </p>

        </section>


        <section class="test-selector">

            <div class="selector-header">
                <h2>Start a Test</h2>
                <p>Choose what you want to practice.</p>
            </div>


            <div class="form-group">

                <label for="course">
                    Course
                </label>

                <select id="course">

                    <option value="">
                        Select a course
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="topic">
                    Topic
                </label>

                <select id="topic" disabled>

                    <option value="">
                        Select a course first
                    </option>

                </select>

            </div>


            <div class="test-details">

                <div class="detail">

                    <span class="detail-label">
                        QUESTIONS
                    </span>

                    <strong id="question-count">
                        —
                    </strong>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        TIME
                    </span>

                    <strong id="test-time">
                        —
                    </strong>

                </div>

            </div>


            <button
                id="start-test"
                class="start-button"
                disabled
            >
                Start Test
                <span>→</span>
            </button>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
