<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - CBT</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <div class="logo">
                    <span>✦</span>
                    <strong>CBT</strong>
                </div>

                <h1>
                    Create your account
                </h1>

                <p>
                    Create an account to track your
                    practice tests and results.
                </p>

            </div>


            <form id="register-form">

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <p
                    id="register-error"
                    class="auth-error"
                ></p>


                <button
                    type="submit"
                    class="start-button auth-button"
                >
                    Create Account
                    <span>→</span>
                </button>

            </form>


            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Log in
                </a>

            </div>

        </section>

    </main>


    <script src="js/register.js"></script>

</body>

</html>
