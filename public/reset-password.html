<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Nursing CBT</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <h1>Create a New Password</h1>
            <p>Enter your new password below.</p>

            <form id="reset-password-form">
                <div class="form-group">
                    <label for="password">New password</label>
                    <input
                        type="password"
                        id="password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm new password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <p id="message" role="status" aria-live="polite"></p>

                <button type="submit" class="auth-button" id="submit-button">
                    Reset Password
                </button>
            </form>

            <p class="auth-footer">
                <a href="login.html">Back to Login</a>
            </p>
        </section>
    </main>

    <script src="js/password-toggle.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
